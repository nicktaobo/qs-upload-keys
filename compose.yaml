services:
  app:
    image: ${IMAGE_NAME:-ghcr.io/nicktaobo/qs-upload-keys}:${IMAGE_TAG:-latest}
    container_name: qs-upload-keys
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
